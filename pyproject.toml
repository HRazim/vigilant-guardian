[tool.poetry]
name = "vigilant-guardian"
version = "0.1.0"
description = "AI-Powered Zero-Day Vulnerability Intelligence"
authors = ["Vigilant Guardian Team"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
# Framework API (section 3.1)
fastapi = ">=0.110"
uvicorn = {extras = ["standard"], version = "*"}
pydantic = ">=2.0"
pydantic-settings = "*"
# ORM + Migrations (section 3.1)
sqlalchemy = ">=2.0"
alembic = "*"
asyncpg = "*"
psycopg2-binary = "*"
# Task Queue (section 3.1)
celery = ">=5.3"
redis = ">=5.0"
flower = "*"
# NLP & ML (section 3.1)
sentence-transformers = "*"
spacy = "*"
scikit-learn = "*"
hdbscan = "*"
faiss-cpu = "*"
numpy = "*"
# LLM Clients (section 3.4)
openai = "*"
anthropic = "*"
# HTTP
httpx = "*"
requests = "*"
# Web Scraping (section 3.1)
beautifulsoup4 = "*"
# Vector Store RAG (section 3.2)
chromadb = ">=0.4"
# Auth (section 8.2)
python-jose = {extras = ["cryptography"], version = "*"}
passlib = "*"
bcrypt = "4.0.1"
# Utils
python-dotenv = "*"
tenacity = "*"
structlog = "*"
# Reports (section 9.2 Semaine 8)
weasyprint = "*"
# Email validation
email-validator = "*"
python-multipart = "^0.0.22"

[tool.poetry.group.dev.dependencies]
pytest = "*"
pytest-asyncio = "*"
pytest-cov = "*"
ruff = "*"
mypy = "*"
black = "*"
isort = "*"
pre-commit = "*"
safety = "*"

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "W", "F", "I", "N", "UP", "S", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.isort]
profile = "black"
line_length = 100

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
