[tool.poetry]
name = "vigilant-guardian"
version = "0.1.0"
description = "AI-Powered Zero-Day Vulnerability Intelligence"
authors = ["Vigilant Guardian Team"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = ">=0.110"
uvicorn = {extras = ["standard"], version = "*"}
pydantic = ">=2.0"
pydantic-settings = "*"
sqlalchemy = ">=2.0"
alembic = "*"
asyncpg = "*"
celery = ">=5.3"
redis = ">=5.0"
flower = "*"
sentence-transformers = "*"
spacy = "*"
scikit-learn = "*"
hdbscan = "*"
faiss-cpu = "*"
openai = "*"
anthropic = "*"
httpx = "*"
requests = "*"
beautifulsoup4 = "*"
python-jose = {extras = ["cryptography"], version = "*"}
passlib = "*"
bcrypt = "*"
python-dotenv = "*"
tenacity = "*"
structlog = "*"
chromadb = ">=0.4"
weasyprint = "*"

[tool.poetry.group.dev.dependencies]
pytest = "*"
pytest-asyncio = "*"
pytest-cov = "*"
ruff = "*"
mypy = "*"
black = "*"
isort = "*"
pre-commit = "*"
safety = "*"

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "W", "F", "I", "N", "UP", "S", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"