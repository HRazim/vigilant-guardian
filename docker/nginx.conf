# ============================================================================
# Vigilant Guardian — Nginx reverse proxy (section 4.5)
# TLS termination + routing API / Frontend
# ============================================================================

upstream api_backend {
    server api:8000;
}

upstream frontend_app {
    server frontend:3000;
}

server {
    listen 80;
    server_name _;

    # Redirect HTTP → HTTPS (en production)
    # return 301 https://$host$request_uri;

    # Pour le prototype : servir directement
    location /api/ {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Rate limiting global
        limit_req zone=api burst=20 nodelay;
    }

    location /docs {
        proxy_pass http://api_backend;
    }

    location /redoc {
        proxy_pass http://api_backend;
    }

    location /health {
        proxy_pass http://api_backend;
    }

    location / {
        proxy_pass http://frontend_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket support (alertes temps réel — section 2.2)
    location /ws/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;
